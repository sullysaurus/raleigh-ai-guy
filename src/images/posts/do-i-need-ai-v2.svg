<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="Practical small business test for deciding whether to use AI">
  <rect width="1672" height="941" fill="#f3e7d5"/><rect x="22" y="22" width="1628" height="897" fill="none" stroke="#151515" stroke-width="4"/>
  <rect x="22" y="22" width="1628" height="118" fill="#151515"/><text x="70" y="77" fill="#f3e7d5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="5">SMALL BUSINESS AI TEST</text><text x="1600" y="79" text-anchor="end" fill="#d9fa67" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">START WITH THE PROBLEM</text>
  <rect x="70" y="190" width="430" height="510" fill="#dce8ff" stroke="#151515" stroke-width="4"/><text x="102" y="240" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">QUESTION 1</text><text x="102" y="310" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700">REPEATED?</text><path d="M168 420c0-60 48-108 108-108s108 48 108 108-48 108-108 108h-72M205 528l-42-4 18-38" fill="none" stroke="#151515" stroke-width="10"/><circle cx="276" cy="420" r="27" fill="#ff6f4f" stroke="#151515" stroke-width="5"/><text x="102" y="620" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="24">Does the same work</text><text x="102" y="655" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="24">keep coming back?</text>
  <rect x="536" y="190" width="430" height="510" fill="#ff6f4f" stroke="#151515" stroke-width="4"/><text x="568" y="240" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">QUESTION 2</text><text x="568" y="310" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700">EXPENSIVE?</text><circle cx="751" cy="430" r="104" fill="#f3e7d5" stroke="#151515" stroke-width="6"/><text x="751" y="462" text-anchor="middle" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="700">$</text><text x="568" y="620" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="24">Does it cost real time</text><text x="568" y="655" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="24">or lost opportunity?</text>
  <rect x="1002" y="166" width="600" height="558" fill="#d9fa67" stroke="#151515" stroke-width="6"/><rect x="1020" y="184" width="564" height="522" fill="none" stroke="#151515" stroke-width="2"/><text x="1052" y="240" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">QUESTION 3</text><text x="1052" y="310" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700">CHECKABLE?</text><rect x="1080" y="360" width="440" height="190" fill="#f3e7d5" stroke="#151515" stroke-width="6"/><path d="M1130 410l18 18 36-44M1130 474l18 18 36-44M1215 412h250M1215 476h190" fill="none" stroke="#151515" stroke-width="7"/><text x="1052" y="620" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="24">Can you quickly tell</text><text x="1052" y="655" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="24">whether it worked?</text>
  <rect x="70" y="766" width="1532" height="102" fill="#151515"/><text x="836" y="830" text-anchor="middle" fill="#f3e7d5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">IF IT DOESN'T SAVE TIME OR MONEY, SKIP IT.</text>
</svg>
