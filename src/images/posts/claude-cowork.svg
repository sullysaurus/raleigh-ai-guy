<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="Decision guide comparing Claude Chat with Claude Cowork">
  <rect width="1672" height="941" fill="#f3e7d5"/><rect x="22" y="22" width="1628" height="897" fill="none" stroke="#151515" stroke-width="4"/>
  <rect x="22" y="22" width="1628" height="118" fill="#151515"/><text x="70" y="77" fill="#f3e7d5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="5">CLAUDE WORK MODE GUIDE</text><text x="1600" y="79" text-anchor="end" fill="#d9fa67" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">MATCH THE MODE TO THE JOB</text>
  <rect x="70" y="190" width="540" height="510" fill="#dce8ff" stroke="#151515" stroke-width="4"/><text x="104" y="240" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">ONE STEP</text><text x="104" y="310" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700">CHAT</text><rect x="138" y="370" width="404" height="150" rx="40" fill="#f3e7d5" stroke="#151515" stroke-width="6"/><path d="M190 420h300M190 466h220" stroke="#151515" stroke-width="8"/><path d="M440 520l42 48 6-48" fill="#f3e7d5" stroke="#151515" stroke-width="6"/><text x="104" y="620" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="25">Ask, answer, revise,</text><text x="104" y="657" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="25">and stay in the loop</text>
  <rect x="654" y="166" width="948" height="558" fill="#d9fa67" stroke="#151515" stroke-width="6"/><rect x="672" y="184" width="912" height="522" fill="none" stroke="#151515" stroke-width="2"/><text x="708" y="240" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">COMPLETE OUTCOME</text><text x="708" y="310" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700">COWORK</text>
  <rect x="708" y="370" width="210" height="160" fill="#dce8ff" stroke="#151515" stroke-width="5"/><text x="813" y="430" text-anchor="middle" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">FILES</text><path d="M756 472h114" stroke="#151515" stroke-width="7"/>
  <path d="M930 450h74M972 418l32 32-32 32" fill="none" stroke="#151515" stroke-width="8"/>
  <rect x="1018" y="370" width="210" height="160" fill="#ff6f4f" stroke="#151515" stroke-width="5"/><text x="1123" y="430" text-anchor="middle" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">RESEARCH</text><circle cx="1123" cy="482" r="26" fill="#f3e7d5" stroke="#151515" stroke-width="5"/>
  <path d="M1240 450h74M1282 418l32 32-32 32" fill="none" stroke="#151515" stroke-width="8"/>
  <rect x="1328" y="350" width="210" height="200" fill="#e9e4ff" stroke="#151515" stroke-width="5"/><text x="1433" y="410" text-anchor="middle" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">FINISHED</text><text x="1433" y="442" text-anchor="middle" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">BRIEF</text><path d="M1372 484h122M1372 520h88" stroke="#151515" stroke-width="6"/>
  <text x="708" y="620" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="25">Delegate a multi-step task</text><text x="708" y="657" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="25">and review the finished work</text>
  <rect x="70" y="766" width="1532" height="102" fill="#151515"/><text x="836" y="830" text-anchor="middle" fill="#f3e7d5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">USE CHAT FOR A STEP. COWORK FOR THE OUTCOME.</text>
</svg>
